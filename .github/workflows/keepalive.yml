# Keeps the free-plan Supabase project from auto-pausing (it pauses after ~7
# idle days) by calling /api/keepalive once a day. Fails loudly if the site or
# database is down, so it also works as a basic uptime alert.
name: Keep Supabase awake

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --retry 3 --retry-delay 10 https://path-wise-seven.vercel.app/api/keepalive
